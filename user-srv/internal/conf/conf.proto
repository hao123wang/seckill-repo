syntax = "proto3";
package kratos.api;

option go_package = "user-srv/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string addr = 1;
    string user = 2;
    string password = 3;
    string dbname = 4;
    bool debug = 5;
    int32 max_idle_conn = 6;
    int32 max_open_conn = 7;
  }
  message Redis {
    string addr = 1;
		string password = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}
